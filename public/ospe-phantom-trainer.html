    <style>
      :root {
        --font-display: 'Plus Jakarta Sans', system-ui, sans-serif;
        --font-sans: 'DM Sans', system-ui, sans-serif;
        --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
      }
      body {
        font-family: var(--font-sans);
        background-color: #f8fafc;
        color: #0f172a;
      }
      h1, h2, h3, h4, .font-display {
        font-family: var(--font-display);
      }
      .font-mono-tabular {
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
      }
      .phantom-organ {
        cursor: pointer;
        transition: filter 160ms cubic-bezier(0.16, 1, 0.3, 1), opacity 160ms ease;
      }
      .phantom-organ:hover {
        filter: brightness(1.08) drop-shadow(0 0 6px rgba(2, 132, 199, 0.45));
      }
      .phantom-organ.is-selected {
        filter: drop-shadow(0 0 8px rgba(2, 132, 199, 0.75));
      }
      .phantom-organ.is-correct {
        filter: drop-shadow(0 0 10px rgba(5, 150, 105, 0.92));
      }
      .phantom-organ.is-wrong {
        filter: drop-shadow(0 0 10px rgba(220, 38, 38, 0.92));
      }
      @keyframes flowDash {
        to { stroke-dashoffset: -28; }
      }
      .flow-animated {
        stroke-dasharray: 8 6;
        animation: flowDash 1.1s linear infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .flow-animated { animation: none; }
        .phantom-organ { transition: none; }
      }
    </style>

        function getDisplayedSystem() {
          if (state.mode === 'locate' && state.locateTarget) return state.locateTarget.system;
          return state.tab === 'mixed' ? state.mixedView : state.tab;
        }

        function shuffle(arr) {
          const c = [...arr];
          for (let i = c.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [c[i], c[j]] = [c[j], c[i]];
          }
          return c;
        }

        function pickNextLocate() {
          let pool = state.tab === 'mixed' ? ORGANS : ORGANS.filter(o => o.system === state.tab);
          if (state.drillMissed) {
            const mp = ORGANS.filter(o => state.missedIds.includes(o.id));
            if (mp.length) pool = mp;
          }
          const cands = pool.length > 1 && state.locateTarget ? pool.filter(o => o.id !== state.locateTarget.id) : pool;
          const chosen = cands[Math.floor(Math.random() * cands.length)] || null;
          state.locateTarget = chosen;
          state.locateKind = state.locatePromptPref === 'mixed' ? (Math.random() < 0.5 ? 'name' : 'clue') : state.locatePromptPref;
          state.locateFeedback = null;
          if (chosen && state.tab === 'mixed') state.mixedView = chosen.system;
        }

        function rebuildQuiz() {
          const pool = state.tab === 'mixed' ? QUIZZES : QUIZZES.filter(q => q.system === state.tab);
          state.quizList = shuffle(pool);
          state.quizIdx = 0;
          state.quizChoice = null;
        }

        function renderAll() {
          // Nav Tabs
          const tabs = [
            { id: 'digestive', label: 'Pencernaan' },
            { id: 'cardiovascular', label: 'Cardiovaskuler' },
            { id: 'endocrine', label: 'Endokrin' },
            { id: 'mixed', label: 'Mode Campuran' },
          ];
          document.getElementById('desktopNav').innerHTML = tabs.map(t =>
            `<button data-tab="${t.id}" class="py-5 border-b-2 transition-colors whitespace-nowrap shrink-0 ${state.tab===t.id?'border-sky-600 text-slate-900 font-semibold':'border-transparent text-slate-600 hover:text-slate-900'}">${t.label}</button>`
          ).join('');
          document.getElementById('mobileNav').innerHTML = tabs.map(t =>
            `<button data-tab="${t.id}" class="px-3 py-1.5 text-xs font-medium rounded-md whitespace-nowrap shrink-0 ${state.tab===t.id?'bg-slate-900 text-white':'bg-slate-100 text-slate-700'}">${t.label}</button>`
          ).join('');

          // Mode Tabs
          const modes = [
            { id: 'explore', label: '1. Eksplorasi Phantom' },
            { id: 'locate', label: '2. Tebak Lokasi' },
            { id: 'quiz', label: '3. Kuis Fisiologi' },
          ];
          document.getElementById('modeTabs').innerHTML = modes.map(m =>
            `<button data-mode="${m.id}" class="px-3 py-1.5 text-xs font-semibold rounded-md transition-colors whitespace-nowrap shrink-0 ${state.mode===m.id?'bg-white text-slate-900 shadow-sm':'text-slate-600 hover:text-slate-900'}">${m.label}</button>`
          ).join('');

          // Telemetry
          document.getElementById('statScore').textContent = state.score;
          document.getElementById('statStreak').textContent = state.streak;
          document.getElementById('statAccuracy').textContent = (state.attempts > 0 ? Math.round((state.corrects / state.attempts) * 100) : 0) + '%';
          document.getElementById('missedCountTop').textContent = state.missedIds.length;

          // Stage
          const sys = getDisplayedSystem();
          const orgCount = ORGANS.filter(o => o.system === sys).length;
          document.getElementById('stageMeta').innerHTML = `${SYSTEM_META[sys].label} · <span class="font-mono-tabular">${orgCount} Struktur</span>`;
          document.getElementById('stageTitle').textContent = state.tab === 'mixed' ? `Mode Campuran — ${SYSTEM_META[sys].label}` : SYSTEM_META[sys].label;
          document.getElementById('stageSystemTag').textContent = SYSTEM_META[sys].shortLabel;

          let ctrlHtml = '';
          if (state.tab === 'mixed' && state.mode !== 'locate') {
            ctrlHtml += `<div class="flex items-center gap-1 p-1 bg-slate-100 rounded-lg">` +
              ['digestive','cardiovascular','endocrine'].map(s => `<button data-mview="${s}" class="px-2.5 py-1 text-xs font-medium rounded-md whitespace-nowrap ${state.mixedView===s?'bg-white text-slate-900 shadow-sm':'text-slate-600'}">${SYSTEM_META[s].shortLabel}</button>`).join('') +
              `</div>`;
          }
          if (state.mode === 'explore') {
            ctrlHtml += `<button id="toggleLblBtn" class="px-3 py-1.5 text-xs font-medium rounded-lg border border-slate-200 bg-white text-slate-700 hover:bg-slate-50 whitespace-nowrap">${state.showLabels ? 'Sembunyikan Label' : 'Tampilkan Label'}</button>`;
          }
          document.getElementById('stageControls').innerHTML = ctrlHtml;

          const cvBar = document.getElementById('cardioLayerBar');
          if (sys === 'cardiovascular') {
            cvBar.classList.remove('hidden');
            cvBar.innerHTML = `<span class="text-xs text-slate-500">Lapisan Phantom Jantung:</span>
              <div class="flex items-center gap-1 p-1 bg-slate-100 rounded-lg">
                ${[{id:'all',l:'Anatomi Lengkap'},{id:'conduction',l:'Konduksi Listrik'},{id:'circulation',l:'Aliran Darah'}].map(x =>

                ).join('')}
              </div>`;
          } else {
            cvBar.classList.add('hidden');
          }

          const svgStage = document.getElementById('svgStage');
          svgStage.innerHTML = sys === 'digestive' ? renderDigestiveSvg() : sys === 'cardiovascular' ? renderCardioSvg() : renderEndocrineSvg();

          document.getElementById('hoverCaption').textContent = state.mode === 'locate' && !state.locateFeedback
            ? 'Mode Ujian Aktif: Label disembunyikan. Klik bagian organ yang diminta.'
            : 'Arahkan kursor atau klik langsung organ pada diagram phantom.';

          // Right Deck
          const deck = document.getElementById('rightDeck');
          if (state.mode === 'explore') {
            const org = ORGANS.find(o => o.id === state.selectedId);
            const avail = state.tab === 'mixed' ? ORGANS : ORGANS.filter(o => o.system === state.tab);
            const flows = state.tab === 'mixed' ? FLOWS : FLOWS.filter(f => f.system === state.tab);
            const actFlow = FLOWS.find(f => f.id === state.flowId);
            const actStep = actFlow ? actFlow.steps[state.flowStep] : null;

            deck.innerHTML = `
              <div class="bg-white border border-slate-200 rounded-xl p-5 sm:p-6">
                ${org ? `
                  <div class="text-xs text-slate-500 mb-2">${SYSTEM_META[org.system].label} · ${org.category} · <span class="font-mono-tabular italic text-sky-700">${org.latinName}</span></div>
                  <h2 class="text-xl font-bold text-slate-900 mb-4">${org.name}</h2>
                  <div class="space-y-3.5 text-sm leading-relaxed text-slate-700">
                    <div><h3 class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Letak &amp; Struktur</h3><p>${org.locationAndStructure}</p></div>
                    <div class="pt-3 border-t border-slate-100"><h3 class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Fungsi Utama</h3><p>${org.mainFunction}</p></div>
                    <div class="pt-3 border-t border-slate-100"><h3 class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Peran Fisiologis</h3><p>${org.physiologicalRole}</p></div>
                    <div class="pt-3 border-t border-slate-100"><div class="bg-sky-50 border border-sky-200 rounded-lg p-3 text-xs text-slate-700"><strong>Catatan OSPE:</strong> ${org.ospeTip}</div></div>
                    <div class="text-xs text-slate-500 font-mono-tabular">${org.keyFacts.join(' · ')}</div>
                  </div>` : '<p class="text-sm text-slate-600">Klik organ pada phantom di sebelah kiri.</p>'}
              </div>
              <div class="bg-white border border-slate-200 rounded-xl p-5 sm:p-6">
                <h3 class="text-sm font-bold text-slate-900 mb-2">Alur Fisiologi &amp; Mekanisme</h3>
                <div class="flex flex-wrap gap-1.5 mb-3">
                  ${flows.map(f => `<button data-flow="${f.id}" class="px-3 py-1.5 text-xs font-medium rounded-lg border ${state.flowId===f.id?'bg-slate-900 text-white border-slate-900':'bg-slate-50 text-slate-700 border-slate-200'}">${f.title}</button>`).join('')}
                </div>
                ${actFlow && actStep ? `
                  <div class="bg-slate-50 border border-slate-200 rounded-lg p-4">
                    <div class="text-xs font-mono-tabular font-semibold text-sky-700 mb-1">Langkah ${state.flowStep+1} / ${actFlow.steps.length} · ${actFlow.summary}</div>
                    <h4 class="text-sm font-bold text-slate-900 mb-1">${actStep.title}</h4>
                    <p class="text-sm text-slate-700 mb-3">${actStep.detail}</p>
                    <div class="flex items-center justify-between">
                      <button id="flowPrevBtn" ${state.flowStep===0?'disabled':''} class="px-3 py-1.5 text-xs font-medium rounded-lg border border-slate-200 bg-white disabled:opacity-40">Sebelumnya</button>
                      <button id="flowNextBtn" ${state.flowStep===actFlow.steps.length-1?'disabled':''} class="px-3 py-1.5 text-xs font-medium rounded-lg bg-sky-600 text-white disabled:opacity-40">Lanjut</button>
                    </div>
                  </div>` : '<p class="text-xs text-slate-500">Pilih alur di atas untuk menyorot jalur fisiologi pada diagram.</p>'}
              </div>
              <div class="bg-white border border-slate-200 rounded-xl p-5">
                <h3 class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2.5">Daftar Struktur (${avail.length})</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-1.5 max-h-52 overflow-y-auto">
                  ${avail.map(o => `<button data-pick="${o.id}" class="text-left px-3 py-2 rounded-lg text-xs font-medium truncate ${state.selectedId===o.id?'bg-sky-50 text-sky-900 border border-sky-300':'bg-slate-50 text-slate-700 hover:bg-slate-100'}">${o.name}</button>`).join('')}
                </div>
              </div>`;
          } else if (state.mode === 'locate') {
            const t = state.locateTarget;
            const fb = state.locateFeedback;
            deck.innerHTML = `
              <div class="bg-white border border-slate-200 rounded-xl p-5 space-y-3">
                <div class="flex flex-wrap items-center justify-between gap-2">
                  <span class="text-xs font-semibold text-slate-500 uppercase">Format Soal</span>
                  <div class="flex items-center gap-1 p-1 bg-slate-100 rounded-lg">
                    ${[{id:'mixed',l:'Acak'},{id:'name',l:'Nama Organ'},{id:'clue',l:'Fungsi/Ciri'}].map(x =>
                      `<button data-lpref="${x.id}" class="px-2.5 py-1 text-xs font-medium rounded-md ${state.locatePromptPref===x.id?'bg-white text-slate-900 shadow-sm':'text-slate-600'}">${x.l}</button>`
                    ).join('')}
                  </div>
                </div>
                <div class="flex items-center justify-between pt-2 border-t border-slate-100 text-xs">
                  <span>Fokus Organ Masih Salah (${state.missedIds.length})</span>
                  <button id="toggleDrillBtn" ${state.missedIds.length===0&&!state.drillMissed?'disabled':''} class="px-3 py-1.5 font-medium rounded-lg border disabled:opacity-40 ${state.drillMissed?'bg-amber-600 text-white border-amber-600':'bg-white text-slate-700 border-slate-200'}">${state.drillMissed?'Mode Ulang Aktif':'Latih Bagian Salah'}</button>
                </div>
              </div>
              <div class="bg-white border border-slate-200 rounded-xl p-5 sm:p-6">
                ${t ? `
                  <div class="text-xs text-slate-500 mb-3">Soal #${state.locateNum} · ${SYSTEM_META[t.system].label} · ${state.locateKind==='name'?'Identifikasi Nama':'Klu Fungsi'}</div>
                  ${state.locateKind==='name'
                    ? `<p class="text-xs text-slate-500 mb-1">Klik struktur berikut pada diagram phantom:</p><h2 class="text-2xl font-bold text-slate-900 mb-1">${t.name}</h2><p class="text-xs font-mono-tabular italic text-slate-500">${t.latinName}</p>`
                    : `<p class="text-xs text-slate-500 mb-1.5">Tunjukkan pada phantom organ yang sesuai:</p><p class="text-base font-semibold text-slate-900">"${t.cluePrompt}"</p>`}
                  ${!fb
                    ? `<div class="mt-5 text-xs text-sky-800 bg-sky-50 border border-sky-200 rounded-lg px-3.5 py-2.5">Klik langsung bagian organ pada diagram SVG di sebelah kiri.</div>`
                    : `<div class="mt-5 space-y-4">
                        <div class="rounded-lg border p-4 ${fb.ok?'bg-emerald-50 border-emerald-200':'bg-rose-50 border-rose-200'}">
                          <div class="font-bold text-sm ${fb.ok?'text-emerald-900':'text-rose-900'} mb-1">${fb.ok?'Benar! Lokasi Tepat (+10 Poin)':'Kurang Tepat — Lokasi Benar Ditandai Hijau'}</div>
                          ${!fb.ok && fb.clicked ? `<p class="text-xs text-rose-800 mb-1">Anda mengklik: <strong>${fb.clicked.name}</strong>.</p>` : ''}
                          <p class="text-xs text-slate-700"><strong>${fb.target.name}:</strong> ${fb.target.mainFunction}</p>
                        </div>
                        <button id="nextLocateBtn" class="w-full py-2.5 text-sm font-semibold rounded-lg bg-slate-900 text-white hover:bg-slate-800">Soal Berikutnya →</button>
                      </div>`
                  }` : '<p class="text-sm text-slate-600">Tidak ada soal.</p>'}
              </div>`;
          } else {
            const q = state.quizList[state.quizIdx];
            const ans = state.quizChoice;
            deck.innerHTML = q ? `
              <div class="bg-white border border-slate-200 rounded-xl p-5 sm:p-6 space-y-4">
                <div class="text-xs text-slate-500 font-mono-tabular">Soal ${state.quizIdx+1} / ${state.quizList.length} · ${SYSTEM_META[q.system].label}</div>
                <h2 class="text-base sm:text-lg font-bold text-slate-900">${q.q}</h2>
                <div class="space-y-2">
                  ${q.opts.map((opt, idx) => {
                    let cls = 'bg-white border-slate-200 text-slate-800 hover:bg-slate-50';
                    if (ans !== null) {
                      if (idx === q.ans) cls = 'bg-emerald-50 border-emerald-500 text-emerald-950 font-medium';
                      else if (idx === ans) cls = 'bg-rose-50 border-rose-500 text-rose-950';
                      else cls = 'bg-slate-50 border-slate-200 text-slate-400';
                    }
                    return `<button data-qopt="${idx}" ${ans!==null?'disabled':''} class="w-full text-left px-4 py-3 rounded-lg border text-sm transition-colors ${cls}"><strong>${String.fromCharCode(65+idx)}.</strong> ${opt}</button>`;
                  }).join('')}
                </div>
                ${ans !== null ? `
                  <div class="pt-3 border-t border-slate-100 space-y-3">
                    <div class="rounded-lg border p-3.5 text-xs sm:text-sm ${ans===q.ans?'bg-emerald-50 border-emerald-200 text-emerald-950':'bg-rose-50 border-rose-200 text-rose-950'}">
                      <div class="font-bold mb-1">${ans===q.ans?'Jawaban Benar (+10 Poin)':'Kurang Tepat — Jawaban: '+String.fromCharCode(65+q.ans)}</div>
                      <p class="text-slate-700">${q.exp}</p>
                    </div>
                    <button id="nextQuizBtn" class="w-full py-2.5 text-sm font-semibold rounded-lg bg-slate-900 text-white hover:bg-slate-800">Pertanyaan Berikutnya →</button>
                  </div>` : ''}
              </div>` : '';
          }

          bindEvents();
        }

        function bindEvents() {
          document.querySelectorAll('[data-tab]').forEach(el => {
            el.onclick = () => {
              state.tab = el.dataset.tab;
              state.flowId = null;
              if (state.tab !== 'mixed') {
                const first = ORGANS.find(o => o.system === state.tab);
                if (first) state.selectedId = first.id;
              }
              rebuildQuiz();
              if (state.mode === 'locate') { state.locateNum = 1; pickNextLocate(); }
              renderAll();
            };
          });
          document.querySelectorAll('[data-mode]').forEach(el => {
            el.onclick = () => {
              state.mode = el.dataset.mode;
              if (state.mode === 'locate') { state.locateNum = 1; pickNextLocate(); }
              renderAll();
            };
          });
          document.querySelectorAll('[data-mview]').forEach(el => {
            el.onclick = () => { state.mixedView = el.dataset.mview; renderAll(); };
          });
          document.querySelectorAll('[data-cvlayer]').forEach(el => {
            el.onclick = () => { state.cardioLayer = el.dataset.cvlayer; renderAll(); };
          });
          const lblBtn = document.getElementById('toggleLblBtn');
          if (lblBtn) lblBtn.onclick = () => { state.showLabels = !state.showLabels; renderAll(); };

          document.querySelectorAll('[data-organ]').forEach(el => {
            const oid = el.dataset.organ;
            el.onmouseenter = () => {
              if (state.mode === 'explore') {
                const o = ORGANS.find(x => x.id === oid);
                if (o) document.getElementById('hoverCaption').textContent = `Sorotan: ${o.name} (${o.latinName})`;
              }
            };
            el.onclick = () => {
              if (state.mode === 'explore') {
                state.selectedId = oid;
                renderAll();
              } else if (state.mode === 'locate' && state.locateTarget && !state.locateFeedback) {
                const clicked = ORGANS.find(x => x.id === oid) || null;
                const ok = oid === state.locateTarget.id;
                state.attempts++;
                if (ok) { state.score += 10; state.streak++; state.corrects++; }
                else {
                  state.streak = 0;
                  if (!state.missedIds.includes(state.locateTarget.id)) state.missedIds.push(state.locateTarget.id);
                }
                state.locateFeedback = { ok, clicked, target: state.locateTarget };
                renderAll();
              }
            };
          });

          document.querySelectorAll('[data-pick]').forEach(el => {
            el.onclick = () => {
              state.selectedId = el.dataset.pick;
              const o = ORGANS.find(x => x.id === state.selectedId);
              if (o && state.tab === 'mixed') state.mixedView = o.system;
              renderAll();
            };
          });
          document.querySelectorAll('[data-flow]').forEach(el => {
            el.onclick = () => {
              state.flowId = state.flowId === el.dataset.flow ? null : el.dataset.flow;
              state.flowStep = 0;
              if (state.flowId) {
                const f = FLOWS.find(x => x.id === state.flowId);
                if (f) {
                  if (state.tab === 'mixed') state.mixedView = f.system;
                  if (f.steps[0]?.highlight[0]) state.selectedId = f.steps[0].highlight[0];
                }
              }
              renderAll();
            };
          });
          const fp = document.getElementById('flowPrevBtn');
          if (fp) fp.onclick = () => { state.flowStep = Math.max(0, state.flowStep - 1); renderAll(); };
          const fn = document.getElementById('flowNextBtn');
          if (fn) fn.onclick = () => { state.flowStep++; renderAll(); };

          document.querySelectorAll('[data-lpref]').forEach(el => {
            el.onclick = () => { state.locatePromptPref = el.dataset.lpref; pickNextLocate(); renderAll(); };
          });
          const td = document.getElementById('toggleDrillBtn');
          if (td) td.onclick = () => { state.drillMissed = !state.drillMissed; state.locateNum = 1; pickNextLocate(); renderAll(); };
          const nl = document.getElementById('nextLocateBtn');
          if (nl) nl.onclick = () => { state.locateNum++; pickNextLocate(); renderAll(); };

          document.querySelectorAll('[data-qopt]').forEach(el => {
            el.onclick = () => {
              const idx = Number(el.dataset.qopt);
              const q = state.quizList[state.quizIdx];
              if (!q || state.quizChoice !== null) return;
              state.quizChoice = idx;
              state.attempts++;
              if (idx === q.ans) { state.score += 10; state.streak++; state.corrects++; }
              else {
                state.streak = 0;
                if (!state.missedIds.includes(q.organ)) state.missedIds.push(q.organ);
              }
              if (state.tab === 'mixed') state.mixedView = q.system;
              state.selectedId = q.organ;
              renderAll();
            };
          });
          const nq = document.getElementById('nextQuizBtn');
          if (nq) nq.onclick = () => {
            if (state.quizIdx + 1 < state.quizList.length) state.quizIdx++;
            else { rebuildQuiz(); }
            state.quizChoice = null;
            renderAll();
          };
        }

        function renderMissedModal() {
          const modal = document.getElementById('missedModal');
          const list = ORGANS.filter(o => state.missedIds.includes(o.id));
          document.getElementById('missedModalSub').textContent = `${list.length} struktur perlu pengulangan`;
          const body = document.getElementById('missedModalBody');
          const footer = document.getElementById('missedModalFooter');
          if (!list.length) {
            body.innerHTML = `<p class="text-sm text-slate-600 text-center py-8">Belum ada organ yang salah.</p>`;
            footer.classList.add('hidden');
          } else {
            footer.classList.remove('hidden');
            body.innerHTML = list.map(o => `
              <div class="border border-slate-200 rounded-lg p-3 flex items-center justify-between gap-3 bg-slate-50">
                <div><div class="text-xs text-slate-500">${SYSTEM_META[o.system].shortLabel} · ${o.latinName}</div><div class="text-sm font-semibold text-slate-900">${o.name}</div></div>
                <div class="flex gap-1.5">
                  <button data-mlearn="${o.id}" class="px-2.5 py-1.5 text-xs font-medium rounded-lg border border-slate-200 bg-white">Pelajari</button>
                  <button data-mdel="${o.id}" class="px-2 py-1.5 text-xs text-rose-700 hover:bg-rose-50 rounded-lg">Hapus</button>
                </div>
              </div>`).join('');
            body.querySelectorAll('[data-mlearn]').forEach(b => b.onclick = () => {
              const o = ORGANS.find(x => x.id === b.dataset.mlearn);
              if (o) { state.tab = o.system; state.selectedId = o.id; state.mode = 'explore'; modal.classList.add('hidden'); renderAll(); }
            });
            body.querySelectorAll('[data-mdel]').forEach(b => b.onclick = () => {
              state.missedIds = state.missedIds.filter(id => id !== b.dataset.mdel);
              renderMissedModal(); renderAll();
            });
          }
          modal.classList.remove('hidden');
        }

        document.getElementById('openMissedTopBtn').onclick = renderMissedModal;
        document.getElementById('closeMissedBtn').onclick = () => document.getElementById('missedModal').classList.add('hidden');
        document.getElementById('clearMissedBtn').onclick = () => { state.missedIds = []; state.drillMissed = false; renderMissedModal(); renderAll(); };
        document.getElementById('drillAllMissedBtn').onclick = () => {
          state.tab = 'mixed'; state.mode = 'locate'; state.drillMissed = true; state.locateNum = 1; pickNextLocate();
          document.getElementById('missedModal').classList.add('hidden'); renderAll();
        };
        document.getElementById('resetStatsBtn').onclick = () => { state.score = 0; state.streak = 0; state.attempts = 0; state.corrects = 0; renderAll(); };

        rebuildQuiz();
        renderAll();
      })();
    </script>
  </body>
</html>
